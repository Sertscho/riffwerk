<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" font-family="-apple-system,system-ui,sans-serif" role="img" aria-label="Anschlag: zwischen Tonabnehmer und Steg, Ab und Auf, Handkante zum Dämpfen">
