  <g fill="#fbe3cf"><ellipse cx="104" cy="68" rx="7" ry="5"/><ellipse cx="165" cy="68" rx="7" ry="5"/><ellipse cx="315" cy="68" rx="7" ry="5"/></g>
  <g font-size="12" text-anchor="middle">
    <text x="66" y="176" fill="#3ddc84" font-weight="600">✓ Richtig</text><text x="66" y="193" fill="#f3eee8">kurz vor dem</text><text x="66" y="208" fill="#f3eee8">Bundstab</text>
    <text x="166" y="176" fill="#ff9f1c" font-weight="600">Geht</text><text x="166" y="193" fill="#f3eee8">braucht aber</text><text x="166" y="208" fill="#f3eee8">mehr Kraft</text>
    <text x="276" y="176" fill="#ff4d4d" font-weight="600">✗ Falsch</text><text x="276" y="193" fill="#f3eee8">auf dem Stab:</text><text x="276" y="208" fill="#f3eee8">klingt dumpf</text>
  </g>
</svg>
